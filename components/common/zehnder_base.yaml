# Common base for all fw versions

esphome:
  min_version: 2026.8.0

uart:
  id: uart_modbus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  uart_id: uart_modbus
  id: modbus1

modbus_controller:
- id: modbus_device
  address: 0x1
  modbus_id: modbus1
  setup_priority: -10
  update_interval: ${update_interval}
  on_offline:
    then:
      - text_sensor.template.publish:
          id: zehnder_status
          state: "Offline"
